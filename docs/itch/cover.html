<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>nirbija cover</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; }
  .cover {
    width: 630px; height: 500px;
    background: #ebe4d4;
    color: #161410;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    position: relative;
    overflow: hidden;
    box-sizing: border-box;
    padding: 28px 32px 24px;
    display: flex;
    flex-direction: column;
  }
  .cover::before {
    content: "";
    position: absolute; inset: 0;
    pointer-events: none;
    opacity: 0.05;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }
  .kicker {
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: lowercase;
    color: #6f685c;
    margin: 0 0 8px;
  }
  .row {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 16px;
  }
  h1 {
    margin: 0;
    font-family: "IBM Plex Sans", sans-serif;
    font-weight: 300;
    font-size: 64px;
    line-height: 0.88;
    letter-spacing: -0.04em;
  }
  .product {
    margin: 4px 0 0;
    font-family: "IBM Plex Sans", sans-serif;
    font-weight: 300;
    font-size: 22px;
    letter-spacing: -0.03em;
  }
  .mark { display: flex; align-items: flex-end; gap: 7px; height: 52px; }
  .mark i { display: block; width: 8px; background: #161410; }
  .mark i:nth-child(1) { height: 22px; }
  .mark i:nth-child(2) { height: 52px; }
  .mark i:nth-child(3) { height: 36px; }
  .device {
    margin-top: 18px;
    flex: 1;
    min-height: 0;
    background: #0f1113;
    overflow: hidden;
    box-shadow: 0 18px 40px rgba(22,20,16,.18);
  }
  .device img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: left center;
  }
  .compat {
    display: flex;
    gap: 8px;
    margin-top: 14px;
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: lowercase;
    color: #6f685c;
  }
  .compat span {
    border: 1px solid #cfc6b2;
    padding: 4px 8px 3px;
  }
</style>
</head>
<body>
  <div class="cover">
    <p class="kicker">linux instrument</p>
    <div class="row">
      <div>
        <h1>nirbija</h1>
        <p class="product">mixer.</p>
      </div>
      <div class="mark" aria-hidden="true"><i></i><i></i><i></i></div>
    </div>
    <div class="device">
      <img src="../img/hero.png" alt="">
    </div>
    <div class="compat">
      <span>linux</span><span>clap</span><span>lv2</span><span>vst3</span>
    </div>
  </div>
</body>
</html>
