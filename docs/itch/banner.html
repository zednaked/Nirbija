<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>nirbija banner</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; }
  .banner {
    width: 1920px; height: 400px;
    background: #ebe4d4;
    color: #161410;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    display: grid;
    grid-template-columns: 1fr 920px;
    align-items: center;
    padding: 0 80px 0 88px;
    box-sizing: border-box;
    position: relative;
    overflow: hidden;
  }
  .banner::before {
    content: "";
    position: absolute; inset: 0;
    pointer-events: none;
    opacity: 0.045;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }
  .kicker {
    font-size: 13px;
    letter-spacing: 0.22em;
    text-transform: lowercase;
    color: #6f685c;
    margin: 0 0 12px;
  }
  h1 {
    margin: 0;
    font-family: "IBM Plex Sans", sans-serif;
    font-weight: 300;
    font-size: 92px;
    line-height: 0.88;
    letter-spacing: -0.04em;
  }
  .product {
    margin: 8px 0 0;
    font-family: "IBM Plex Sans", sans-serif;
    font-weight: 300;
    font-size: 28px;
  }
  .lede {
    margin: 18px 0 0;
    color: #6f685c;
    font-size: 16px;
    max-width: 28em;
  }
  .mark {
    position: absolute;
    left: 88px;
    bottom: 48px;
    display: flex;
    align-items: flex-end;
    gap: 8px;
    height: 36px;
  }
  .mark i { display: block; width: 6px; background: #161410; }
  .mark i:nth-child(1) { height: 16px; }
  .mark i:nth-child(2) { height: 36px; }
  .mark i:nth-child(3) { height: 24px; }
  .device {
    width: 920px;
    height: 300px;
    background: #0f1113;
    overflow: hidden;
    box-shadow: 0 24px 60px rgba(22,20,16,.2);
    justify-self: end;
  }
  .device img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: left center;
  }
</style>
</head>
<body>
  <div class="banner">
    <div>
      <p class="kicker">linux instrument</p>
      <h1>nirbija</h1>
      <p class="product">mixer.</p>
      <p class="lede">a row of channels. plugins live in the strip. press play.</p>
    </div>
    <div class="device"><img src="../img/hero.png" alt=""></div>
    <div class="mark" aria-hidden="true"><i></i><i></i><i></i></div>
  </div>
</body>
</html>
