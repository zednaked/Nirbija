name: build e testes

# Um passe de sanitizer numa arvore limpa: sem Qt, dependencias minimas,
# NIRBIJA_UI=OFF, a suite headless inteira sob ASan + UBSan. E onde aparece a
# classe de bug que revisao nao pega - foi assim que se viu que o step sequencer
# estourava a pilha sob ASan (e portanto o maior modulo do projeto estava fora
# da cobertura), e que um insert removido sem servidor de audio nunca era
# liberado.
#
# O job que compilava com a UI num contentor Arch saiu: a maquina de
# desenvolvimento e Arch e compila a cada build, entao ele confirmava o que ja
# se via - e custava mais do que este, 4,5 dos 6,5 minutos da execucao.
#
# Nada aqui precisa de Xvfb nem de servidor de audio: engine_smoke e
# midi_clock_follow devolvem 77 e o ctest marca Skipped, os testes de plugin
# desistem sozinhos quando nao ha plugin, e os de UI ja forcam
# QT_QPA_PLATFORM=offscreen por conta propria.

# So sob demanda. Este repo e privado, e em repo privado o Actions consome a
# cota mensal da conta - diferente de repo publico, onde e ilimitado. Medido na
# primeira execucao: 2 min o passe de sanitizer, e o mesmo passe roda de graca
# na maquina, pelo hook de pre-push em .githooks/. O que sobra aqui e o valor
# que a maquina nao da: uma arvore limpa, num runner que nao e o seu.
#
# Rodar: gh workflow run "build e testes"  (ou pelo botao na aba Actions)
on:
  workflow_dispatch:

jobs:
  sanitizers:
    name: core sob ASan + UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Sem Qt: com NIRBIJA_UI=OFF nada em src/ui entra no build, e é lá que
      # moram Qt e X11.
      - name: dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ pkg-config git \
            libjack-jackd2-dev libsndfile1-dev liblilv-dev \
            liblua5.4-dev libsystemd-dev

      # vst3_pluginterfaces e clap vêm por FetchContent; sem cache é um clone a
      # cada execução.
      - name: cache dos SDKs buscados
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: configurar
        run: |
          cmake -S . -B build -G Ninja \
            -DNIRBIJA_UI=OFF -DNIRBIJA_TESTS=ON \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: compilar
        run: cmake --build build -j"$(nproc)"

      # detect_leaks=0 não é preguiça: o LeakSanitizer acusa vazamentos dentro
      # de pw_context_load_module quando o libjack abre o cliente, e são do
      # PipeWire, não daqui. Sem isso quatro testes parecem quebrados.
      #
      # halt_on_error=0 para que o UBSan relate tudo o que achar num só passe em
      # vez de parar no primeiro.
      - name: testes
        env:
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=0
        run: ctest --test-dir build --output-on-failure
