name: build e testes

# O repositorio e publico, e em repositorio publico o Actions nao consome cota:
# entao roda a cada push e a cada pull request, alem de sob demanda. O hook
# de pre-push em .githooks/ continua sendo o guardiao rapido na maquina; o que
# este workflow da e uma arvore limpa, num runner que nao e o seu, e um
# AppImage anexado ao release quando uma tag v* e empurrada.
#
# Dois trabalhos:
#   - sanitizers: sem Qt, NIRBIJA_UI=OFF, a suite headless inteira sob
#     ASan + UBSan. E onde aparece a classe de bug que revisao nao pega.
#   - tsan: a suite rapida sob ThreadSanitizer.
#   - ui: com Qt 6, num conteiner Arch, compila a interface, roda o qmllint e
#     os testes de UI offscreen. Ate aqui nada da UI era verificado fora da
#     maquina do autor.
#
# Nada aqui precisa de Xvfb nem de servidor de audio: os testes que precisam
# de JACK devolvem 77 e o ctest marca Skipped, os testes de plugin usam o
# Drone CLAP gerado no proprio build, e os de UI forcam
# QT_QPA_PLATFORM=offscreen por conta propria.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  sanitizers:
    name: core sob ASan + UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ pkg-config git \
            libjack-jackd2-dev libsndfile1-dev liblilv-dev \
            liblua5.4-dev libsystemd-dev

      - name: cache dos SDKs buscados
        uses: actions/cache@v4
        with:
          path: build-asan/_deps
          key: deps-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: configurar
        run: cmake --preset asan

      - name: compilar
        run: cmake --build --preset asan -j"$(nproc)"

      # detect_leaks=0 não é preguiça: o LeakSanitizer acusa vazamentos dentro
      # de pw_context_load_module quando o libjack abre o cliente, e são do
      # PipeWire, não daqui. halt_on_error=0 para que o UBSan relate tudo o que
      # achar num só passe em vez de parar no primeiro.
      - name: testes
        run: ctest --preset all

  tsan:
    name: core sob ThreadSanitizer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ pkg-config git \
            libjack-jackd2-dev libsndfile1-dev liblilv-dev \
            liblua5.4-dev libsystemd-dev
      - name: cache dos SDKs buscados
        uses: actions/cache@v4
        with:
          path: build-tsan/_deps
          key: deps-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}
      - name: configurar
        run: cmake --preset tsan
      - name: compilar
        run: cmake --build --preset tsan -j"$(nproc)"
      - name: testes rápidos
        run: ctest --preset tsan

  # Qt 6.5 is the floor (src/ui/CMakeLists.txt) and Ubuntu's runners ship
  # 6.4, so the interface builds in an Arch container, which is also what the
  # project is developed on.
  ui:
    name: interface com Qt 6
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: dependências
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel cmake ninja git pkgconf \
            jack2 jack-example-tools libsndfile lilv lua systemd-libs libx11 \
            qt6-base qt6-declarative
      - uses: actions/checkout@v4
      - name: configurar
        run: cmake --preset dev -DNIRBIJA_WERROR=ON
      - name: compilar
        run: cmake --build --preset dev -j"$(nproc)"
      - name: qmllint
        run: cmake --build build --target nirbija_ui_qmllint
      # Os testes de UI dirigem o mixer inteiro e precisam de um servidor de
      # áudio; sem um, devolvem 77 e aparecem como Skipped. Um jackd com o
      # driver dummy basta: relógio de verdade, nenhuma placa de som.
      - name: testes de UI (offscreen, JACK dummy)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          jackd --no-realtime -d dummy -r 48000 -p 256 &
          for i in $(seq 50); do jack_lsp > /dev/null 2>&1 && break; sleep 0.2; done
          ctest --test-dir build -L '^ui$' --output-on-failure
